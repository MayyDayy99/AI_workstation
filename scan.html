<script>
        // A tokenek csak akkor jelentenek bármit, ha a data-theme be van
        // állítva. Ez a csonk SZÁNDÉKOSAN nem tölti be a shared.js-t —
        // egy azonnal átirányító lapra a monitor- és munkaterület-kezelés
        // fölösleges teher —, ezért a döntési szabály itt, a lehető
        // legszűkebben szerepel: mentett választás, különben a rendszeré.
        // Ugyanaz a sorrend, mint a shared.js getTheme()-jében.
        try {
            var _t = localStorage.getItem('edti_theme');
            if (!_t) _t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            if (_t === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f7fa');
            }
        } catch (_) { /* privát mód: marad a sötét alapértelmezés */ }

        window.location.replace('course.html');
    </script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, var(--bg-glow), var(--surface-page) 40%);
            color: var(--text-secondary);
        }

        a {
            color: var(--accent-text);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <script>
      if (false /* demo: SW off */) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function (err) {
            console.warn('SW reg failed:', err);
          });
        });
      }
    </script>
</body>
</html>
