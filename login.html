<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EDTI Studio">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <title>EDTI Stúdió — Bejelentkezés</title>
    <link rel="stylesheet" href="style.css?v=b2484b1bda">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="login-page">
    <main class="login-card">
        <div class="login-logo">
            <span class="icon" aria-hidden="true">🔐</span>
            <h1>EDTI Stúdió</h1>
            <p>Belépés szükséges a használathoz</p>
        </div>

        <!-- role="alert": a képernyőolvasó felolvassa a hibát, amint megjelenik.
             A .hidden !important-tal tilt, ezért a JS is classList-tel váltja. -->
        <div class="form-error hidden" id="errorMsg" role="alert">
            Hibás felhasználónév vagy jelszó.
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="login-field">
                <label for="username">Felhasználónév</label>
                <input type="text" id="username" name="username" placeholder="pl. admin" autocomplete="username"
                    required autofocus>
            </div>
            <div class="login-field">
                <label for="password">Jelszó</label>
                <input type="password" id="password" name="password" placeholder="••••••••"
                    autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-accent btn-block" id="loginBtn">
                Belépés →
            </button>
        </form>
    </main>

    <script src="mock_core.js"></script>
<script src="mock_routes_core.js"></script>
<script src="mock_routes_batch.js"></script>
<script src="mock_routes_ppt.js"></script>
<script src="mock_routes_flow.js"></script>
<script src="mock_routes_subtitle.js"></script>
<script src="mock_routes_misc.js"></script>
<script src="mock_routes_extra.js"></script>
<script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('errorMsg');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) return;

            btn.disabled = true;
            btn.textContent = 'Bejelentkezés...';
            errorEl.classList.add('hidden');

            try {
                const resp = await fetch('api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (resp.ok) {
                    // Success — redirect to main app
                    // Store username in cookie for the app's user display
                    document.cookie = `currentUser=${encodeURIComponent(username)}; path=/; max-age=${60*60*24*30}; samesite=lax`;
                    window.location.href = 'index.html';
                } else {
                    const data = await resp.json().catch(() => ({}));
                    errorEl.textContent = data.detail || 'Hibás felhasználónév vagy jelszó.';
                    errorEl.classList.remove('hidden');
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (err) {
                errorEl.textContent = 'Kapcsolódási hiba. Próbáld újra.';
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Belépés →';
            }
        }

        // If already logged in, redirect
        (async () => {
            try {
                const resp = await fetch('api/me');
                if (resp.ok) window.location.href = 'index.html';
            } catch (e) { /* not logged in */ }
        })();
    </script>
    <script>
      if (false /* demo: SW off */) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function (err) {
            console.warn('SW reg failed:', err);
          });
        });
      }
    </script>
</body>

</html>
